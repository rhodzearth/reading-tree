<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Fruitdoku – White Fruit Logic Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff6ef;--bg2:#ffe3de;--ink:#6a3d45;--ink2:#a47f84;--line:#ecd3ce;--accent:#e8607a;--bad:#e5484d;--ok:#3fae7a;--shadow:0 8px 22px rgba(120,60,70,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito','Trebuchet MS',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.defs{position:absolute;width:0;height:0;overflow:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{display:none;flex:1;flex-direction:column;padding:12px 16px 0;animation:fade .25s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar h2{margin:0;font-size:20px;font-weight:900;text-align:center;flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 10px rgba(120,60,70,.14)}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:scale(.92)}

/* status */
.status{display:flex;justify-content:center;gap:12px;margin:12px 0 10px}
.pill{background:#fff;border-radius:999px;padding:5px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(120,60,70,.12);font-weight:900;font-size:18px;min-height:40px}
.pill svg.fruit{width:28px;height:28px}
.hearts{gap:4px}
.hearts svg{width:24px;height:24px;color:#ee4056}
.hearts svg.off{color:#e6d6d6}
.hearts svg.lost{animation:beat .5s}
@keyframes beat{0%{transform:scale(1.5)}100%{transform:scale(1)}}

/* energy bar */
.who{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 3px 10px rgba(120,60,70,.12);margin:0 8px 8px;font-weight:900;font-size:14px}
.who .nm{font-size:16px}
.who .id{font-size:12px;color:var(--ink2);font-weight:800;-webkit-user-select:text;user-select:text}
.who .tk{color:#3fae7a}
.energy{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 3px 10px rgba(120,60,70,.12);margin:0 0 10px;font-weight:900;font-size:14px}
.energy .bolt{width:20px;height:20px;color:#f5a623;flex:none}
.energy .bolt svg{width:100%;height:100%;display:block}
.energy .track{flex:1;height:12px;background:#f3e4e0;border-radius:999px;overflow:hidden}
.energy .fill{height:100%;background:linear-gradient(90deg,#ffd45e,#f5a623);border-radius:999px;transition:width .4s}
.energy .num{min-width:42px;text-align:right}
.energy .tm{font-size:12px;color:var(--ink2);font-weight:800;white-space:nowrap}
#h-energy{margin:0 8px 14px}

/* rule chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 3px 10px rgba(120,60,70,.1)}
.chip{border:2px solid transparent;background:#fff8f5;border-radius:12px;padding:8px 4px;font-size:12px;font-weight:800;line-height:1.2;text-align:center;color:var(--ink);min-height:44px}
.chip.active{border-color:#8f5a62;background:#fff}
.chip.bad{border-color:var(--bad);color:var(--bad);animation:shake .4s}

/* board */
.board-wrap{display:flex;justify-content:center;margin:12px 0 4px}
.board{--n:5;--gap:4px;width:min(100%,calc(100vh - 424px));width:min(100%,calc(100dvh - 424px));min-width:270px;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:var(--gap);padding:8px;background:#fff;border-radius:22px;box-shadow:var(--shadow)}
.cell{position:relative;border:0;padding:0;border-radius:18%;display:flex;align-items:center;justify-content:center;transition:transform .08s;min-width:0;min-height:0}
.cell:active{transform:scale(.93)}
.cell:focus-visible{outline:3px solid #8f5a62;outline-offset:1px;z-index:3}
.cell svg.fruit{width:84%;height:84%;filter:drop-shadow(0 2px 2px rgba(70,35,35,.3));pointer-events:none}
.cell svg.xm{width:58%;height:58%;opacity:.96;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(70,35,35,.18))}
.cell .ltr{position:absolute;top:3px;left:5px;font-size:10px;font-weight:900;color:rgba(60,30,30,.5);pointer-events:none}
.cell.pop svg.fruit{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
.cell.pop svg.xm{animation:fadein .2s}
.cell.shake{animation:shake .4s}
.cell.hint{animation:glow 1s ease-in-out infinite;z-index:2}
.board.won .cell svg.fruit{animation:hop .7s ease both}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0;transform:scale(.6)}to{opacity:.96;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.95),0 0 0 0 rgba(232,96,122,.0)}50%{box-shadow:0 0 0 4px rgba(255,255,255,.95),0 0 16px 8px rgba(232,96,122,.75)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-28%) scale(1.1)}70%{transform:translateY(0) scale(.96)}100%{transform:none}}

.msg{min-height:44px;margin:6px 4px 2px;text-align:center;font-size:14px;line-height:1.3;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.msg.bad{color:var(--bad)}
.msg.hint{color:#b0476a}

/* toolbar */
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.tool{position:relative;border:0;background:#fff;border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;box-shadow:0 3px 10px rgba(120,60,70,.12)}
.tool svg{width:24px;height:24px}
.tool:active{transform:scale(.95)}
.tool:disabled{opacity:.45}
.badge{position:absolute;top:-6px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.badge.zero{background:#c9b7b9}

/* wave */
.wave{position:relative;height:60px;margin:auto -16px 0;flex:none}
.wave .bg{position:absolute;inset:0;width:100%;height:100%}
.wave .peek{position:absolute;left:50%;top:-26px;width:60px;height:60px;transform:translateX(-50%)}
.wave .peek svg{width:100%;height:100%;filter:drop-shadow(0 -1px 2px rgba(70,35,35,.18))}

/* home */
.home-top{display:flex;justify-content:flex-end}
.logo{text-align:center;margin:10px 0 18px}
.logo-fruits{display:flex;justify-content:center;gap:2px;height:84px;align-items:flex-end}
.logo-fruits svg{width:68px;height:68px;filter:drop-shadow(0 4px 4px rgba(70,35,35,.22));animation:bob 2.6s ease-in-out infinite}
.logo-fruits svg:nth-child(2){width:84px;height:84px;animation-delay:.3s}
.logo-fruits svg:nth-child(3){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.logo h1{margin:6px 0 0;font-size:44px;font-weight:900;letter-spacing:.5px;color:#7a3f4c}
.logo p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.menu{display:flex;flex-direction:column;gap:12px;padding:0 8px}
.btn{border:0;border-radius:18px;padding:14px 18px;font-size:17px;font-weight:900;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line),0 8px 18px rgba(120,60,70,.1);display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.btn.primary{background:linear-gradient(180deg,#ff8da3,#e8607a);color:#fff;box-shadow:0 4px 0 #c3405a,0 8px 18px rgba(232,96,122,.3);font-size:20px;padding:16px}
.btn.danger{color:var(--bad)}
.btn small{font-size:12px;font-weight:800;color:var(--ink2)}
.btn .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.home-foot{text-align:center;margin:18px 0 22px;font-size:14px;color:var(--ink2)}

/* levels */
.lvl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0 20px}
.lvl{border:0;background:#fff;border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 10px rgba(120,60,70,.12);min-height:74px}
.lvl .num{font-size:20px;font-weight:900;height:26px;display:flex;align-items:center}
.lvl .num svg{width:18px;height:18px}
.lvl .sz{font-size:10px;color:var(--ink2);font-weight:800}
.lvl.locked{background:#f6ebe8;color:#c2a9ab;box-shadow:none}
.lvl.current{outline:3px solid var(--accent)}
.stars{display:flex;gap:1px}
.stars svg{width:13px;height:13px;color:#e9d9d6}
.stars svg.on{color:#ffb92e}
.stars.big svg{width:44px;height:44px}
.lvl-hint{text-align:center;color:var(--ink2);font-size:13px;margin-bottom:12px}

/* modal */
#modal-root{display:none}
#modal-root.open{display:block}
.overlay{position:fixed;inset:0;background:rgba(90,45,52,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{position:relative;background:#fff;border-radius:26px;padding:22px 20px 18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(60,20,30,.4);animation:modalIn .25s ease;-webkit-user-select:none;user-select:none}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 8px;text-align:center;font-size:24px;font-weight:900}
.modal h4{margin:16px 0 4px;font-size:16px;font-weight:900;color:#8a4a58}
.modal p,.modal li{font-size:14.5px;line-height:1.45;font-weight:700}
.modal ul,.modal ol{padding-left:20px;margin:6px 0}
.modal .sub{text-align:center;color:var(--ink2);margin:8px 0 14px}
.mcol{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.modal .stars{justify-content:center;margin:6px 0}
.mini{display:grid;grid-template-columns:repeat(3,44px);gap:3px;justify-content:center;margin:10px auto 4px}
.mini div{width:44px;height:44px;border-radius:9px;background:#ffd9e2;display:grid;place-items:center}
.mini div svg{width:30px;height:30px}
.mini .c{background:#b5e1a0}
.cap{text-align:center;color:var(--ink2);font-size:13px!important;margin:2px 0 0}
details{background:#fff8f5;border-radius:12px;padding:8px 12px;margin:8px 0}
summary{font-weight:900;cursor:pointer}
.set-lab{font-weight:900;margin:4px 0 8px}
.fruit-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.fp{border:2px solid var(--line);background:#fff8f5;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800;gap:2px}
.fp svg{width:38px;height:38px}
.fp.sel{border-color:#8f5a62;background:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px solid #f3e4e0;font-size:15px}
.row small{display:block;color:var(--ink2);font-size:12px;font-weight:700}
.row input{display:none}
.sw{flex:none;width:46px;height:28px;border-radius:14px;background:#e5d4d2;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.row input:checked+.sw{background:var(--ok)}
.row input:checked+.sw::after{transform:translateX(18px)}
.loading{text-align:center;padding:12px 0}
.spin{width:38px;height:38px;border-radius:50%;border:5px solid #f3d9d9;border-top-color:var(--accent);margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:26px}
.cf{position:absolute;top:-44px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(560px) rotate(300deg);opacity:.9}}

#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#5a3239;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw;font-size:14px;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* loading modal (same look as the other games) */
#goLoading{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(243,247,238,.96);padding:16px}
#goLoading .gocard{width:100%;max-width:300px;background:#fff;border-radius:16px;padding:26px 22px;box-shadow:0 6px 24px rgba(0,0,0,.2);text-align:center}
.goSpin{width:42px;height:42px;margin:0 auto 14px;border:4px solid #dfe8cf;border-top-color:#2f7d32;border-radius:50%;animation:goSpin .8s linear infinite}
@keyframes goSpin{to{transform:rotate(360deg)}}
.goTitle{font-size:17px;font-weight:700;color:#1b5e20}
.goSub{font-size:13px;color:#666;margin-top:4px;font-weight:600}
@media (prefers-reduced-motion:reduce){.goSpin{animation-duration:2.5s!important}}
@media (max-width:360px){.chip{font-size:11px}.tool{font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app">

  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen">
    <div class="home-top"><button class="icon-btn" id="home-settings" aria-label="Settings"></button></div>
    <div class="logo">
      <div class="logo-fruits" id="logo-fruits"></div>
      <h1>Fruitdoku</h1>
      <p>A white-fruit logic puzzle</p>
    </div>
    <div class="who" id="h-who" style="display:none"></div>
    <div class="energy" id="h-energy"></div>
    <div class="menu">
      <button class="btn primary" id="btn-play">Play <span id="play-level"></span></button>
      <button class="btn" id="btn-levels">Levels</button>
      <button class="btn" id="btn-daily">Daily Challenge <small id="daily-sub"></small></button>
      <button class="btn" id="btn-help">How to Play</button>
      <button class="btn" id="btn-exit">🌳 Back to Reading Tree</button>
    </div>
    <div class="home-foot" id="home-stats"></div>
    <div class="wave" aria-hidden="true">
      <svg class="bg" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 26 C60 4 120 6 200 24 S340 44 400 14 V60 H0Z" fill="#bfe3f4"/></svg>
    </div>
  </section>

  <!-- ============ LEVEL SELECT ============ -->
  <section id="screen-levels" class="screen">
    <header class="bar">
      <button class="icon-btn" id="lv-back" aria-label="Back"></button>
      <h2>Levels</h2>
      <span style="width:42px"></span>
    </header>
    <div class="lvl-grid" id="lvl-grid"></div>

  },
  set:function(k,v){mem[k]=v;try{window.localStorage.setItem(PFX+k,JSON.stringify(v));}catch(e){}},
  del:function(k){delete mem[k];try{window.localStorage.removeItem(PFX+k);}catch(e){}},

};

let actx=null;
function tone(freq,dur,type,vol,when){
  if(!settings.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}

/* ============ Daily date (server date keeps everyone on the same puzzle) ============ */
let todayKey=null;
function fetchToday(cb){
  if(todayKey){cb(todayKey);return;}
  let done=false;
  function finish(d){if(done)return;done=true;todayKey=d;cb(d);}
  try{
    if(window.google&&google.script&&google.script.run){
      google.script.run
        .withSuccessHandler(function(d){finish(/^\d{4}-\d{2}-\d{2}$/.test(d)?d:clientDate());})
        .withFailureHandler(function(){finish(clientDate());})
        .getServerDate();
      setTimeout(function(){finish(clientDate());},2500);
    }else finish(clientDate());
  }catch(e){finish(clientDate());}
}
function buildDaily(key){
  const cached=LS.get('dpuz.'+key,null);
  if(cached&&cached.n&&cached.reg&&cached.sol&&cached.reg.length===cached.n*cached.n)return cached;
  const dn=dayNum(key);
  const n=[6,7,8,9,10][((dn%5)+5)%5];
  const rng=mulberry32(hashSeed('fruitdoku-daily-'+key));
  let p=null;
  for(let k=0;k<8&&!p;k++)p=generatePuzzle(n,rng,2500);
  if(!p){const pool=LEVELS.filter(function(l){return l.n===n;});const l=pool[((dn%pool.length)+pool.length)%pool.length]||LEVELS[LEVELS.length-1];p={n:l.n,reg:l.reg,sol:l.sol};}
  LS.set('dpuz.'+key,p);
  return p;
}
function activeStreak(){
  const st=progress.streak||{};
  if(!st.last)return 0;
  const t=dayNum(todayKey||clientDate());
  const l=dayNum(st.last);
  return (l===t||l===t-1)?st.count:0;
}

/* ============ ENERGY (the balance lives on the server; this part shows it and asks the server to spend it) ============ */
const ENERGY_ON=!!(window.google&&google.script&&google.script.run); // off in a plain preview outside Apps Script
const ENERGY_COST=5;
const BOLT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>';
let EN={known:false,energy:0,max:20,nextIn:0,regenSec:720,at:0,err:''},flushing=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function readerToken(){return window.FD_TOKEN||'';}
function gas(name,args,ok,bad){ // runs a server function with the Reading Tree login
  const tk=readerToken();
  if(!ENERGY_ON||!tk){bad('Please log in to Reading Tree first.');return;}
  const r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(e&&e.message?e.message:String(e));});
  r[name].apply(r,[tk].concat(args));
}
function setEnergy(o){EN.known=true;EN.err='';EN.energy=o.energy;EN.max=o.max||20;EN.nextIn=o.nextIn||0;EN.regenSec=o.regenSec||720;EN.at=Date.now();if(o.username!==undefined)EN.who={id:o.id,username:o.username,tokens:o.tokens};renderEnergy();}
function renderWho(){ // the name / ID / tokens card on the home screen
  const w=$('#h-who');if(!w)return;
  const show=ENERGY_ON&&EN.who&&curScreen==='home';
  w.style.display=show?'flex':'none';
  if(!show)return;
  const h='<span class="nm">🌳 '+esc(EN.who.username)+'</span><span class="tk">🧺 '+Number(EN.who.tokens).toLocaleString()+' tokens</span><span class="id">ID: '+esc(EN.who.id)+'</span>';
  if(w.__h!==h){w.innerHTML=h;w.__h=h;}
}
function energyNow(){ // best guess between server checks (the server always has the final say)
  if(!EN.known)return null;
  let e=EN.energy,left=EN.nextIn-(Date.now()-EN.at)/1000;
  while(e<EN.max&&left<=0){e++;left+=EN.regenSec;}
  if(e>=EN.max){e=EN.max;left=0;}
  return {e:e,left:Math.max(0,Math.ceil(left))};
}
function renderEnergy(){
  renderWho();
  const box=curScreen==='game'?$('#g-energy'):curScreen==='home'?$('#h-energy'):null;
  ['#g-energy','#h-energy'].forEach(function(s){const b=$(s);if(b)b.style.display=(ENERGY_ON&&b===box)?'flex':'none';});
  if(!box||!ENERGY_ON)return;
  const n=energyNow();
  const h=!n?'<span class="bolt">'+BOLT+'</span><span class="tm">'+(EN.err?esc(EN.err):'Checking energy…')+'</span>'
    :'<span class="bolt">'+BOLT+'</span><div class="track"><div class="fill" style="width:'+(n.e/EN.max*100)+'%"></div></div><span class="num">'+n.e+'/'+EN.max+'</span><span class="tm">'+(n.e>=EN.max?'Full':'+1 in '+fmtTime(n.left))+'</span>';
  if(box.__h!==h){box.innerHTML=h;box.__h=h;}
}
function flushPending(cb){ // energy that could not be charged earlier (no connection) is charged now
  const p=LS.get('pend',0)|0;
  if(!p||!ENERGY_ON||flushing){cb();return;}
  flushing=true;LS.del('pend');
  gas('authEnergySpend',[true,p],function(o){flushing=false;setEnergy(o);cb();},function(){flushing=false;LS.set('pend',(LS.get('pend',0)|0)+p);cb();});
}
function refreshEnergy(cb){
  if(!ENERGY_ON){if(cb)cb(true);return;}
  flushPending(function(){
    gas('authEnergy',[],function(o){setEnergy(o);if(cb)cb(true);},function(m){EN.err=m;renderEnergy();if(cb)cb(false,m);});
  });
}
function chargeLoss(){ // all 3 hearts are gone: the run costs 5 energy
  if(!ENERGY_ON)return;
  gas('authEnergySpend',[true,1],setEnergy,function(){LS.set('pend',(LS.get('pend',0)|0)+1);});
}
function requireEnergy(go){ // a new run needs at least 5 energy (it is not spent here)
  if(!ENERGY_ON){go();return;}
  const n=energyNow();
  if(n&&n.e>=ENERGY_COST){go();return;}
  openModal('<div class="loading"><div class="spin"></div><p>Checking your energy…</p></div>',{},{dismissible:false});
  refreshEnergy(function(ok,msg){
    closeModal();
    const m=energyNow();
    if(ok&&m&&m.e>=ENERGY_COST){go();return;}
    showNoEnergy(ok?'':msg);
  });
}
function beginRun(id,go){if(LS.get('save.'+id,null)){go();return;}requireEnergy(go);} // continuing a saved game is free
function showNoEnergy(msg){
  const n=energyNow();
  const body=msg?'<p class="sub">'+esc(msg)+'</p>':'<p class="sub">Each run needs '+ENERGY_COST+' ⚡ energy. You have '+(n?n.e:0)+'.'+(n&&n.left?'<br>Next +1 ⚡ in '+fmtTime(n.left)+'.':'')+'<br>Reading a chapter in Reading Tree gives +5 ⚡.</p>';
  openModal('<h3>⚡ Not enough energy</h3>'+body+'<div class="mcol"><button class="btn primary" data-act="tree">🌳 Go read a chapter</button><button class="btn" data-act="ok">OK</button></div>',
    {tree:function(){closeModal();goReadingTree();},ok:function(){closeModal();}});
}

  const box=$('#goLoading');

  setTimeout(function(){ // short pause so the modal is drawn first
    try{
      google.script.run
        .withSuccessHandler(function(u){window.open(u,'_top');})
        .withFailureHandler(fail)
        .getAppUrl();
    }catch(e){fail();}
  },120);
}

  G={cfg:cfg,mode:cfg.mode,id:cfg.id,title:cfg.title,level:cfg.level||0,dateKey:cfg.dateKey||null,
     n:cfg.n,reg:cfg.reg,sol:cfg.sol,grid:new Uint8Array(N),hearts:START_HEARTS,hints:START_HINTS,
     revived:false,mistakes:0,hintsUsed:0,hintCell:-1,tapMode:'mark',history:[],elapsed:0,t0:0,
     over:false,won:false,chip:1};
  let resumed=false;
  const sv=LS.get('save.'+G.id,null);
  if(sv&&sv.grid&&sv.grid.length===N&&valid(sv)){
    G.grid=Uint8Array.from(sv.grid);G.hearts=sv.hearts;G.hints=sv.hints;G.revived=!!sv.revived;
    G.mistakes=sv.mistakes|0;G.hintsUsed=sv.hintsUsed|0;G.elapsed=sv.elapsed|0;resumed=true;
  }
  G.t0=Date.now();
  lastTap={i:-1,t:0,snap:null};
  initialRender=true;
  $('#g-title').textContent=G.title;
  buildBoard();
  renderAll();
  initialRender=false;
  showScreen('game');
  if(resumed)say('Welcome back — your progress was restored.','');
  else if(G.mode==='level'&&G.level===1&&!progress.stars[1])say('Tip: the green color has only one square. Double-tap it to place a fruit!','hint');
  else say('','');
  function valid(s){
    if(typeof s.hearts!=='number'||s.hearts<1||s.hearts>START_HEARTS)return false;
    for(let i=0;i<s.grid.length;i++){
      const v=s.grid[i];
      if(v!==0&&v!==1&&v!==2)return false;
      if(v===2&&G.sol[(i/G.n)|0]!==i%G.n)return false;
    }
    return true;
  }
}
function countPlaced(){let c=0;for(let i=0;i<G.grid.length;i++)if(G.grid[i]===2)c++;return c;}
function elapsedNow(){return G.elapsed+(G.t0?Date.now()-G.t0:0);}
function save(){
  if(!G||G.over||G.won)return;
  LS.set('save.'+G.id,{grid:Array.from(G.grid),hearts:G.hearts,hints:G.hints,revived:G.revived,mistakes:G.mistakes,hintsUsed:G.hintsUsed,elapsed:elapsedNow()});
}
function say(text,kind){
  const m=$('#g-msg');
  m.textContent=text||'';
  m.className='msg'+(kind?' '+kind:'');
  clearTimeout(msgTimer);
  if(text)msgTimer=setTimeout(function(){m.textContent='';m.className='msg';},7000);
}

/* ---- board rendering ---- */
function buildBoard(){
  const board=$('#board'),n=G.n;
  board.innerHTML='';board.classList.remove('won');
  board.style.setProperty('--n',n);
  board.style.setProperty('--gap',(n<=6?5:n<=8?4:3)+'px');
  cells=[];rendered=new Array(n*n).fill(-1);
  for(let i=0;i<n*n;i++){
    const b=document.createElement('button');
    b.type='button';b.className='cell';b.setAttribute('data-i',i);b.setAttribute('role','gridcell');
    b.style.background=COLORS[G.reg[i]];
    board.appendChild(b);cells.push(b);
  }
}
function cellHTML(i){
  const st=G.grid[i];
  let h=st===2?fruitSvg(settings.fruit,'fruit'):st===1?ICON.x:'';
  if(settings.letters)h+='<span class="ltr">'+LETTERS[G.reg[i]]+'</span>';
  return h;
}
function renderBoard(){
  const n=G.n;
  for(let i=0;i<n*n;i++){
    const st=G.grid[i],el=cells[i];
    if(rendered[i]!==st){
      el.innerHTML=cellHTML(i);
      if(!initialRender&&st!==0){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
      rendered[i]=st;
    }
    el.classList.toggle('hint',i===G.hintCell);
    const r=((i/n)|0)+1,c=(i%n)+1;
    el.setAttribute('aria-label','Row '+r+', column '+c+', '+COLOR_NAMES[G.reg[i]]+', '+(st===2?'fruit':st===1?'marked':'empty'));
  }
}
function forceRerender(){if(G){rendered=new Array(G.n*G.n).fill(-1);const keep=initialRender;initialRender=true;renderAll();initialRender=keep;}}
function renderStatus(lostIdx){
  $('#g-count').innerHTML=fruitSvg(settings.fruit,'fruit')+'<span>'+countPlaced()+'/'+G.n+'</span>';
  let h='';
  for(let i=0;i<START_HEARTS;i++){
    const on=i<G.hearts;
    h+=ICON.heart.replace('<svg','<svg class="'+(on?'':'off')+(i===lostIdx?' lost':'')+'"');
  }

}
function renderChips(){

  for(let i=0;i<chips.length;i++)chips[i].classList.toggle('active',i===G.chip);
}
function renderTools(){
  $('#t-undo').innerHTML=ICON.undo+'<span>Undo</span>';
  $('#t-hint').innerHTML=ICON.hint+'<span>Hint</span><b class="badge'+(G.hints?'':' zero')+'" id="hint-n">'+G.hints+'</b>';
  $('#t-mode').innerHTML=(G.tapMode==='mark'?ICON.xTool:fruitSvg(settings.fruit,'fruit'))+'<span>'+(G.tapMode==='mark'?'Mark ✕':'Place')+'</span>';
  $('#t-restart').innerHTML=ICON.restart+'<span>Restart</span>';
  $('#g-peek').innerHTML=fruitSvg(settings.fruit,'fruit');
}
function renderAll(lostIdx){renderBoard();renderStatus(lostIdx);renderChips();renderTools();}

/* ---- rules ---- */
function conflictsWithPlaced(i){
  const n=G.n,r=(i/n)|0,c=i%n,g=G.reg[i];
  for(let k=0;k<n*n;k++){
    if(G.grid[k]!==2)continue;
    const kr=(k/n)|0,kc=k%n;
    if(G.reg[k]===g||kr===r||kc===c||(Math.abs(kr-r)<=1&&Math.abs(kc-c)<=1))return true;
  }
  return false;
}
function explainWrong(i){
  const n=G.n,r=(i/n)|0,c=i%n,g=G.reg[i];
  for(let k=0;k<n*n;k++){
    if(G.grid[k]!==2)continue;
    const kr=(k/n)|0,kc=k%n;
    if(G.reg[k]===g)return {chip:0,msg:'That color already has a fruit.'};
    if(kr===r||kc===c)return {chip:1,msg:'Only one fruit per row and per column.'};
    if(Math.abs(kr-r)<=1&&Math.abs(kc-c)<=1)return {chip:2,msg:'Fruits can’t touch — not even diagonally.'};
  }
  return {chip:-1,msg:'Not here — that square would leave another color with nowhere to go.'};
}
function autoMark(i){
  const n=G.n,r=(i/n)|0,c=i%n,g=G.reg[i];
  for(let k=0;k<n*n;k++){
    if(k===i||G.grid[k]!==0)continue;
    const kr=(k/n)|0,kc=k%n;
    if(kr===r||kc===c||G.reg[k]===g||(Math.abs(kr-r)<=1&&Math.abs(kc-c)<=1))G.grid[k]=1;
  }
}

/* ---- actions ---- */
function onCellClick(i,e){
  if(!G||G.over||G.won)return;
  if(G.grid[i]===2){lastTap={i:-1,t:0,snap:null};return;}
  if(e&&e.shiftKey){placeFruit(i);return;}
  if(G.tapMode==='place'){placeFruit(i);return;}
  const now=Date.now();
  if(lastTap.i===i&&now-lastTap.t<DOUBLE_MS&&lastTap.snap){
    G.history.pop();
    G.grid=lastTap.snap.slice();
    lastTap={i:-1,t:0,snap:null};
    placeFruit(i);
    return;
  }
  const snap=G.grid.slice();
  G.history.push(snap);
  G.grid[i]=G.grid[i]===1?0:1;
  lastTap={i:i,t:now,snap:snap};
  sfx.tick();
  renderBoard();save();
}
function placeFruit(i){
  if(!G||G.over||G.won||G.grid[i]===2)return;
  const n=G.n,r=(i/n)|0,c=i%n;
  G.history.push(G.grid.slice());
  lastTap={i:-1,t:0,snap:null};
  if(G.sol[r]!==c){wrongMove(i);return;}
  G.grid[i]=2;G.hintCell=-1;
  if(settings.autoX)autoMark(i);
  sfx.place();buzz(15);
  const placed=countPlaced();
  renderAll();
  if(placed===n){onWin();return;}
  say(placed===n-1?'One more to go!':'','');
  save();
}
function wrongMove(i){
  G.mistakes++;G.hearts--;G.grid[i]=1;
  const ex=explainWrong(i);
  if(ex.chip>=0){G.chip=ex.chip;}
  renderAll(G.hearts);
  const el=cells[i];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
  if(ex.chip>=0){const ch=document.querySelectorAll('#g-chips .chip')[ex.chip];ch.classList.remove('bad');void ch.offsetWidth;ch.classList.add('bad');setTimeout(function(){ch.classList.remove('bad');},900);}
  say(ex.msg+(G.hearts>0?'':''),'bad');
  sfx.wrong();buzz([60,40,60]);
  if(G.hearts<=0){
    G.over=true;G.t0=0;LS.del('save.'+G.id);
    if(!G.revived)chargeLoss();
    const g=G;
    setTimeout(function(){if(G===g&&curScreen==='game')showGameOver();},700);
  }else save();
}
function undo(){
  if(!G||G.over||G.won)return;
  if(!G.history.length){say('Nothing to undo.','');return;}
  G.grid=G.history.pop();G.hintCell=-1;lastTap={i:-1,t:0,snap:null};
  renderAll();save();sfx.tick();
}
function giveHint(){
  if(!G||G.over||G.won)return;
  if(G.hints<=0){say('No hints left on this level.','bad');return;}
  const n=G.n,N=n*n,placedReg={},cnt=new Array(n).fill(0);
  let i;
  for(i=0;i<N;i++)if(G.grid[i]===2)placedReg[G.reg[i]]=true;
  for(i=0;i<N;i++){
    if(G.grid[i]===2||placedReg[G.reg[i]])continue;
    if(!conflictsWithPlaced(i))cnt[G.reg[i]]++;
  }
  let best=-1,bestCnt=1e9;
  for(let k=0;k<n;k++){if(placedReg[k])continue;if(cnt[k]<bestCnt){bestCnt=cnt[k];best=k;}}
  if(best<0)return;
  let target=-1;
  for(let r=0;r<n;r++){if(G.reg[r*n+G.sol[r]]===best){target=r*n+G.sol[r];break;}}
  G.hints--;G.hintsUsed++;G.hintCell=target;
  renderAll();save();sfx.hint();
  say('Hint: look at the '+COLOR_NAMES[best]+' area — only '+bestCnt+(bestCnt===1?' square':' squares')+' left there. Try the glowing one!','hint');
}
function restartGame(charge){
  if(!G)return;
  const cfg=G.cfg,id=G.id;
  function go(){LS.del('save.'+id);startGame(cfg);}
  if(!ENERGY_ON){go();return;}
  if(!charge){requireEnergy(go);return;}
  openModal('<div class="loading"><div class="spin"></div><p>One moment…</p></div>',{},{dismissible:false});
  gas('authEnergySpend',[false,1],function(o){setEnergy(o);go();},function(m){
    refreshEnergy(function(){closeModal();showNoEnergy(/not enough energy/i.test(m)?'':m);});
  });
}

/* ---- win / lose ---- */
function calcStars(){let s=3;if(G.mistakes>0)s--;if(G.hintsUsed>0)s--;if(G.revived)s--;return Math.max(1,s);}
function onWin(){
  G.won=true;G.elapsed=elapsedNow();G.t0=0;
  const secs=Math.round(G.elapsed/1000),stars=calcStars();
  if(G.mode==='level'){
    progress.stars[G.level]=Math.max(progress.stars[G.level]||0,stars);
    progress.unlocked=Math.max(progress.unlocked,Math.min(TOTAL,G.level+1));
  }else{
    const prev=progress.daily[G.dateKey];
    progress.daily[G.dateKey]={stars:Math.max(stars,prev?prev.stars:0),secs:prev?Math.min(prev.secs,secs):secs};
    if(!prev){
      const st=progress.streak||{last:null,count:0};
      st.count=(st.last&&dayNum(st.last)===dayNum(G.dateKey)-1)?st.count+1:1;
      st.last=G.dateKey;progress.streak=st;
    }
  }
  saveProgress();LS.del('save.'+G.id);
  $('#board').classList.add('won');
  say('','');sfx.win();buzz([30,40,30]);
  const g=G;
  setTimeout(function(){if(G===g&&curScreen==='game')showWin(stars,secs);},900);
}
function confetti(){
  const box=$('#confetti');if(!box)return;
  let h='';
  for(let i=0;i<16;i++){
    const f=FRUITS[Math.floor(Math.random()*FRUITS.length)].id;
    const sz=24+Math.random()*18;
    h+='<span class="cf" style="left:'+(Math.random()*92)+'%;width:'+sz+'px;height:'+sz+'px;animation-duration:'+(2.2+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*1.2)+'s">'+fruitSvg(f,'fruit').replace('<svg','<svg style="width:100%;height:100%"')+'</span>';
  }
  box.innerHTML=h;
}
function showWin(stars,secs){
  const isLevel=G.mode==='level',last=isLevel&&G.level>=TOTAL;
  let btns='';
  if(isLevel&&!last)btns+='<button class="btn primary" data-act="next">Next Level</button>';
  btns+='<button class="btn" data-act="again">Play again</button>';
  btns+='<button class="btn" data-act="menu">'+(isLevel?'Levels':'Home')+'</button>';
  openModal('<div class="confetti" id="confetti"></div><h3>'+(isLevel?'Level Complete!':'Daily Complete!')+'</h3>'+
    '<div class="stars big">'+starRow(stars).replace('<span class="stars">','').replace('</span>','')+'</div>'+
    '<p class="sub">Time '+fmtTime(secs)+' · Mistakes '+G.mistakes+' · Hints '+G.hintsUsed+
    (last?'<br>You cleared every level! Try the Daily Challenge.':'')+'</p><div class="mcol">'+btns+'</div>',
  {
    next:function(){startLevel(G.level+1);},
    again:function(){restartGame();},
    menu:function(){closeModal();leaveGame();}
  },{dismissible:false});
  confetti();
}
function showGameOver(){
  sfx.lose();
  let btns='';
  if(!G.revived)btns+='<button class="btn primary" data-act="revive">Continue with 1 heart</button>';
  btns+='<button class="btn'+(G.revived?' primary':'')+'" data-act="retry">Retry level</button><button class="btn" data-act="menu">Back</button>';
  openModal('<h3>Out of hearts</h3><div class="stars big" style="color:#ee4056;justify-content:center">'+ICON.heart.replace('<svg','<svg style="width:54px;height:54px;color:#e6d6d6"')+'</div>'+
    '<p class="sub">Think it through with the three rules — or use a hint.'+(ENERGY_ON&&!G.revived?'<br>−'+ENERGY_COST+' ⚡ energy used.':'')+(G.revived?'':'<br>You can continue once per level.')+'</p><div class="mcol">'+btns+'</div>',
  {
    revive:function(){
      closeModal();G.revived=true;G.over=false;G.hearts=1;G.t0=Date.now();
      renderAll();save();say('Back in the game — be careful!','');
    },
    retry:function(){restartGame();},
    menu:function(){closeModal();leaveGame();}
  },{dismissible:false});
}
function leaveGame(){
  if(G&&!G.over&&!G.won){G.elapsed=elapsedNow();G.t0=0;save();}
  if(G&&G.mode==='daily'){renderHome();showScreen('home');}
  else{renderLevels();showScreen('levels');}
}

/* ============ Home / Levels ============ */

  board.addEventListener('click',function(e){const b=e.target.closest('.cell');if(b)onCellClick(+b.getAttribute('data-i'),e);});
  board.addEventListener('contextmenu',function(e){const b=e.target.closest('.cell');if(b){e.preventDefault();placeFruit(+b.getAttribute('data-i'));}});
  board.addEventListener('animationend',function(e){const c=e.target.closest&&e.target.closest('.cell');if(c){c.classList.remove('pop');c.classList.remove('shake');}});
  $('#g-chips').addEventListener('click',function(e){
    const b=e.target.closest('.chip');if(!b||!G)return;
    G.chip=+b.getAttribute('data-r');renderChips();
    say(['Every colored region must contain exactly one fruit.','Every row and every column must contain exactly one fruit.','No two fruits may be in neighboring squares — including diagonals.'][G.chip],'');
  });
  $('#t-undo').addEventListener('click',undo);
  $('#t-hint').addEventListener('click',giveHint);
  $('#t-mode').addEventListener('click',function(){
    if(!G)return;
    G.tapMode=G.tapMode==='mark'?'place':'mark';renderTools();
    say(G.tapMode==='place'?'Place mode: a single tap puts a fruit down.':'Mark mode: tap to ✕, double-tap to place a fruit.','');
  });
  $('#t-restart').addEventListener('click',function(){
    if(!G)return;
    openModal('<h3>Restart level?</h3><p class="sub">Your marks, hearts and hints for this level will reset.'+(ENERGY_ON?'<br><b>Restarting costs '+ENERGY_COST+' ⚡ energy.</b>':'')+'</p><div class="mrow"><button class="btn" data-act="no">Cancel</button><button class="btn primary" data-act="yes">Restart</button></div>',
      {no:function(){closeModal();},yes:function(){restartGame(true);}});
  });
  document.addEventListener('visibilitychange',function(){
    if(!G||curScreen!=='game'||G.over||G.won)return;
    if(document.hidden){G.elapsed=elapsedNow();G.t0=0;save();}
    else if(!G.t0){G.t0=Date.now();}
  });

  renderHome();renderLevels();showScreen('home');
  setInterval(renderEnergy,1000);
  refreshEnergy();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshEnergy();}); // picks up energy earned by reading
  fetchToday(function(){renderHome();});
  if(!settings.seenHelp){settings.seenHelp=true;saveSettings();setTimeout(showHelp,400);}
}
init();

})();
</script>
</body>
</html>
