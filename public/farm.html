  cx:ex+(t[0]-ex)*.3+(Math.random()-.5)*70, cy:ey-50-Math.random()*40,
  d:delay,hd:HOLD+(fly||0),a:0,dur:.55+Math.min(.3,Math.hypot(t[0]-ex,t[1]-ey)/2200)+Math.random()*.1,
  ph:Math.random()*6.28,sz:star?24:22,star:!!star,tr:[]})}

  if(n<=6)txt(s[0],s[1]+26,"+"+it.v,it.big?"#ffb347":"#ffe27a");

function drawSprout(p){var u=p.a/p.life,gr=Math.min(1,u/.4),c1=1.70158,c3=c1+1,ru=Math.min(1,p.a/.55),
 k=(1+c3*Math.pow(gr-1,3)+c1*Math.pow(gr-1,2))*p.k,al=u>.7?1-(u-.7)/.3:1;
 if(ru<1){cx.globalAlpha=(1-ru)*.55;cx.strokeStyle="#d8f5b0";cx.lineWidth=2;cx.beginPath();
  cx.ellipse(p.x,p.y+2,(6+26*ru)*p.k,(6+26*ru)*.5*p.k,0,0,6.2832);cx.stroke()}
 cx.save();cx.globalAlpha=al;cx.translate(p.x,p.y);cx.scale(k,k);
 cx.strokeStyle="#3f8f2c";cx.lineWidth=2.4;cx.lineCap="round";
 cx.beginPath();cx.moveTo(0,0);cx.quadraticCurveTo(1.5,-8,0,-15);cx.stroke();
 cx.fillStyle="#58b83e";cx.beginPath();cx.ellipse(-5.5,-15,6.5,3.2,-.6,0,6.2832);cx.fill();
 cx.fillStyle="#7fd35a";cx.beginPath();cx.ellipse(5.5,-15,6.5,3.2,.6,0,6.2832);cx.fill();

function loop(now){RAF=0;
 var dt=Math.min(.05,(now-last)/1000),i,k,p,u,e,v,x,y,s,al,tx,ty;last=now;
 cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.setTransform(DPR,0,0,DPR,0,0);

 for(i=SP.length-1;i>=0;i--){p=SP[i];if(p.d>0){p.d-=dt;continue}
  if(!p.f){p.f=1;burst(p.x,p.y,"#7b5230",p.q,80,300,2.6);burst(p.x,p.y,"#a8794a",Math.ceil(p.q/2),60,260,2)}
  p.a+=dt;if(p.a>=p.life){SP.splice(i,1);continue}drawSprout(p)}

 for(i=D.length-1;i>=0;i--){p=D[i];p.a+=dt;if(p.a>=p.life){D.splice(i,1);continue}
  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  cx.globalAlpha=1-p.a/p.life;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.2832);cx.fill()}

 for(i=P.length-1;i>=0;i--){p=P[i];if(p.d>0){p.d-=dt;continue}
  p.a+=dt;
  if(p.a<POP+p.hd){                                   // 1) pops up above the crop / tree / animal, then hovers
   u=Math.min(1,p.a/POP);e=1+2.70158*Math.pow(u-1,3)+1.70158*Math.pow(u-1,2);
   x=p.x0+(p.ex-p.x0)*e;y=p.y0+(p.ey-p.y0)*e-(p.a>POP?Math.sin((p.a-POP)*6)*2.5:0);
   s=p.sz*(.25+.75*Math.min(1,u*1.3));
   cx.globalAlpha=Math.min(1,p.a/.06)*.55;cx.drawImage(GLOW,x-s*1.2,y-s*1.2,s*2.4,s*2.4);
   cx.globalAlpha=Math.min(1,p.a/.06);drawCoin(p,x,y,s,6);continue}
  u=(p.a-POP-p.hd)/p.dur;                             // 2) flies to the counter, speeding up
  if(u>=1){arrive(p);P.splice(i,1);continue}
  e=.35*u+.65*u*u;v=1-e;
  x=v*v*p.ex+2*v*e*p.cx+e*e*p.x1;y=v*v*p.ey+2*v*e*p.cy+e*e*p.y1;
  p.tr.push(x,y);if(p.tr.length>12)p.tr.splice(0,2);
  s=p.sz*(1+.12*Math.sin(Math.PI*u))*(u>.85?1-(u-.85)/.15*.45:1);
  for(k=0;k<p.tr.length-2;k+=2){cx.globalAlpha=(k/p.tr.length)*.3;tx=p.tr[k];ty=p.tr[k+1];
   cx.drawImage(p.star?STAR:COIN,tx-s*.28,ty-s*.28,s*.56,s*.56)}
  cx.globalAlpha=1;drawCoin(p,x,y,s,11)}

 for(i=T.length-1;i>=0;i--){p=T[i];p.a+=dt;u=p.a/p.life;if(u>=1){T.splice(i,1);continue}
  al=u<.12?u/.12:u>.65?1-(u-.65)/.35:1;e=1-Math.pow(1-u,3);k=1+.35*Math.max(0,1-u/.18);
  cx.globalAlpha=al;cx.save();cx.translate(p.x,p.y-38*e);cx.scale(k,k);
  cx.font="800 16px system-ui,sans-serif";cx.textAlign="center";cx.textBaseline="middle";
  cx.lineJoin="round";cx.lineWidth=4;cx.strokeStyle="rgba(70,40,0,.85)";cx.strokeText(p.t,0,0);
  cx.fillStyle=p.c;cx.fillText(p.t,0,0);cx.restore()}

  else{it=dcById(s.id);f=it&&FTD[it.k];if(f&&!it.s&&now-it.t>=f.ms){pt=cen(it,FarmFX.itemTop(it.k));if(pt)L.push({key:"i:"+it.k,pos:pt})}}})}catch(e){}

 <script>
// tapped tile -> top corner tile, so the tap lands in the MIDDLE of big buildings (1x1 things are unchanged)
function anch(c,r,k){var w=footW(k),h=footH(k);if(OUTI[k]||isF(k)||w*h<2)return[c,r];return[c-((w-1)>>1),r-((h-1)>>1)]}
(function(){
var pad=document.createElement("div"),D=[["\u2196",-1,0],["\u2197",0,-1],["\u2199",0,1],["\u2198",1,0]];
pad.style.cssText="position:fixed;right:10px;z-index:21;display:none;grid-template-columns:repeat(2,48px);gap:6px";
D.forEach(function(d){var b=document.createElement("button");b.className="btn alt";b.textContent=d[0];
 b.style.cssText="width:48px;height:48px;padding:0;font-size:24px;line-height:1;border-radius:14px;background:rgba(20,30,25,.6);color:#fff;border:1px solid rgba(255,255,255,.45);box-shadow:0 2px 8px rgba(0,0,0,.4)";
 b.onclick=function(){nudge(d[1],d[2])};pad.appendChild(b)});
document.body.appendChild(pad);
function nudge(dc,dr){var nc,nr,o,it;
 if(GMOVE){gShift(dc,dr);return}
 if(typeof LGMOVE!=="undefined"&&LGMOVE){lShift(dc,dr);return}
 if(PEND){if(isF(PEND.k))return;nc=PEND.c+dc;nr=PEND.r+dr;
  if(tileFree(nc,nr,null,PEND.k)){PEND.c=nc;PEND.r=nr;HOVT=null;drawAll()}else badTile(nc,nr);return}
 if(!SEL)return;o=getPos(SEL);if(!o)return;
 if(SEL.t==="d"){it=dcById(SEL.id);if(!it||isF(it.k))return}
 nc=o[0]+dc;nr=o[1]+dr;
 if(!tileFree(nc,nr,SEL)){badTile(nc,nr);return}
 setPos(SEL,nc,nr);
 if(SEL.t==="p")send("farmPlotMove",[TOKEN,SEL.i,nc,nr,0]);else send("farmDecor",[TOKEN,SEL.id,nc,nr,0]);
 drawAll()}
function show(){var on=false,it,ly=false;
 if(typeof LGMOVE!=="undefined"&&LGMOVE&&$("lay").style.display!=="none"){on=true;ly=true}
 else if(typeof EDIT!=="undefined"&&EDIT&&!CAM&&!PAINT){
  if(GMOVE)on=true;
  else if(!PLACING){
   if(PEND)on=!isF(PEND.k);
   else if(SEL){if(SEL.t==="p")on=true;else{it=dcById(SEL.id);on=!!it&&!isF(it.k)}}}}
 pad.style.display=on?"grid":"none";
 pad.style.zIndex=ly?"44":"21";
 if(on)pad.style.bottom=((ly?$("lBar").offsetHeight:$("botBar").offsetHeight)+14)+"px"}
setInterval(show,200);
})();

<script>
/* ===== GROUP MOVE: tap = centre of the group, plus arrow nudges (normal editor and Layout editor) ===== */
function gMid(list,posf){var c0=1e9,c1=-1e9,r0=1e9,r1=-1e9;
 list.forEach(function(s){var p=posf(s);if(!p)return;c0=Math.min(c0,p[0]);c1=Math.max(c1,p[0]);r0=Math.min(r0,p[1]);r1=Math.max(r1,p[1])});
 return c0>c1?null:[Math.floor((c0+c1)/2),Math.floor((r0+r1)/2)]}
// the tapped tile becomes the middle of the group
var _gt=gmoveTap;
gmoveTap=function(tc,tr){var a,m;
 if(GMOVE){a=getPos(GMOVE.anchor);m=gMid(GMOVE.list,getPos);if(a&&m){tc+=a[0]-m[0];tr+=a[1]-m[1]}}
 return _gt(tc,tr)};
var _lt=layGmoveTap;
layGmoveTap=function(tc,tr){var a,m;
 if(LGMOVE){a=layPos(LGMOVE.anchor);m=gMid(LGMOVE.list,layPos);if(a&&m){tc+=a[0]-m[0];tr+=a[1]-m[1]}}
 return _lt(tc,tr)};
// arrows: move the whole group by 1 tile and keep the group selected
function gShift(dc,dr){var g=GMOVE,a=g&&getPos(g.anchor);if(!a)return;
 _gt(a[0]+dc,a[1]+dr);
 if(!GMOVE){GMOVE=g;SEL=g.anchor;GPREV=g.list.map(getPos).filter(Boolean);editUI();drawAll()}}
function lShift(dc,dr){var g=LGMOVE,a=g&&layPos(g.anchor);if(!a)return;
 _lt(a[0]+dc,a[1]+dr);
 if(!LGMOVE){LGMOVE=g;SEL=g.anchor;GPREV=g.list.map(layPos).filter(Boolean);layUI();drawAll()}}
</script>

<script>

(function(){

".hvT{display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:6px}"+

var MV={cowshed:["a_cow","\uD83D\uDC04"],sheepshed:["a_sheep","\uD83D\uDC11"],pigshed:["a_pig","\uD83D\uDC37"],chickenshed:["a_chicken","\uD83D\uDC14"]};
function rawAdd(key){if(!S.inv)S.inv={};if(!S.invp)S.invp={};S.inv[key]=(S.inv[key]||0)+1;if(!S.invp[key])S.invp[key]=invUnit(key)}
function pos(c,r,dy){return(window.FarmFX&&FarmFX.scr)?FarmFX.scr(c,r,dy):null}
function mid(it,dy){return pos(it.c+(footW(it.k)-1)/2,it.r+(footH(it.k)-1)/2,dy)}
function shedOf(it){return shedList().filter(function(sd){return sd.cw&&sd.cw.indexOf(it.id)>=0})[0]}

function scan(){var now=nowT(),o={crops:[],fruits:[],prods:[],moves:[]};
 S.plots.forEach(function(p,i){var q=S.pp[i];if(p&&q&&isRipe(p))o.crops.push({i:i,p:p,q:q})});
 (S.dc||[]).forEach(function(it){var f=FTD[it.k];if(!f)return;
  if(!it.s){if(now-it.t>=f.ms)(f.animal?o.prods:o.fruits).push({it:it,f:f})}
  else if(inShed(it)&&now-(it.t||0)>=f.ms)o.prods.push({it:it,f:f,sh:shedOf(it)})});
 shedList().forEach(function(sd){var c=sd.cc;if(!c)return;
  (sd.cf||[]).forEach(function(q){if(now-q.b>=c.g){o.moves.push({sd:sd,q:q});if(!q.m||now-q.m>=c.m)o.prods.push({sd:sd,q:q,c:c})}})});
 return o}

function doCrops(L){var fl=[],xp=0,ops=[];
 L.forEach(function(o){var key=(o.p.b?"cb:":"c:")+o.p.c,s=(fl.length<90)?pos(o.q[0],o.q[1],FarmFX.top):null;
  rawAdd(key);xp+=cr(o.p.c).xp;S.plots[o.i]=null;ops.push(["farmHarvest",[TOKEN,o.i]]);if(s)fl.push({key:key,pos:s})});
 if(ops.length)sendMany(ops);
 return{n:L.length,xp:xp,fl:fl}}

 L.forEach(function(o){var it=o.it,key,s;
  if(o.q){key="y:"+o.sd.k;rawAdd(key);xp+=o.c.x;o.q.m=now;ops.push(["farmCalfMilk",[TOKEN,o.sd.id,o.q.i]]);s=(fl.length<90)?mid(o.sd,-30):null}
  else{key="i:"+it.k;rawAdd(key);xp+=o.f.xp;it.t=now;ops.push(["farmTreeHarvest",[TOKEN,it.id]]);s=(fl.length<90)?(o.sh?mid(o.sh,-30):mid(it,FarmFX.itemTop(it.k))):null}
  if(s)fl.push({key:key,pos:s})});
 if(ops.length)sendMany(ops);
 return{n:L.length,xp:xp,fl:fl}}
function doMoves(L,cnt){var now=nowT(),n=0,ops=[];
 L.forEach(function(o){var a=MV[o.sd.k],id2,i;if(!a)return;
  id2="d"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)+n.toString(36);
  S.dc.push({id:id2,k:a[0],c:0,r:0,s:1,t:now});
  ops.push(["farmCalfOut",[TOKEN,o.sd.id,o.q.i,id2,0]]);
  o.sd.cf=(o.sd.cf||[]).filter(function(z){return z!==o.q});
  n++;cnt[a[1]]=(cnt[a[1]]||0)+1});
 if(ops.length)sendMany(ops);
 return n}

function run(ks){var d=scan(),R={n:0,xp:0,fl:[]},cnt={},mv=0,t;

 if(!R.n&&!mv){toast("Nothing to collect right now.");return}
 S.xp+=R.xp;lvlUp();paint();drawAll();
 if(R.fl.length&&window.FarmFX2)FarmFX2.fly(R.fl);
 t=[];if(R.n)t.push("Collected "+R.n+" things! Stored in barn");
 if(mv)t.push("Moved to barn: "+Object.keys(cnt).map(function(k){return cnt[k]+" "+k}).join("  "));

  row("crops","\uD83C\uDF3E","#9be05a,#3f9a2c","Harvest crops",d.crops.length+" ripe"+(big?" \u00B7 "+big+" BIG":""),d.crops.length,icons(d.crops.map(function(o){return(o.p.b?"cb:":"c:")+o.p.c})))+

  row("moves","\uD83D\uDCE6","#ffd27a,#e0952a","Move animals to barn","Fully grown animals leave the baby rooms",d.moves.length,mvh)+
  "<button class='btn hvA' data-k='all'"+(tot?"":" disabled")+">\u26A1 Collect everything</button>"+
