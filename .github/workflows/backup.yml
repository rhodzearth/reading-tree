name: Weekly backup
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install database tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Make backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$DB_URL" --schema=public --schema=auth -Fc -f backup.dump
          ls -lh backup.dump
      - name: Save backup
        uses: actions/upload-artifact@v4
        with:
          name: reading-tree-backup
          path: backup.dump
          retention-days: 90